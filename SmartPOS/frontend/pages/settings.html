
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SmartPOS</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-cash-register"></i>
            <h2>SmartPOS</h2>
        </div>

        <ul class="menu">
            <li><a href="../index.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
            <li><a href="pos.html"><i class="fa-solid fa-cart-shopping"></i><span>Point of Sale</span></a></li>
            <li><a href="products.html"><i class="fa-solid fa-box"></i><span>Products</span></a></li>
            <li><a href="inventory.html"><i class="fa-solid fa-warehouse"></i><span>Inventory</span></a></li>
            <li><a href="reports.html"><i class="fa-solid fa-chart-line"></i><span>Sales Reports</span></a></li>
            <li><a href="transactions.html"><i class="fa-solid fa-receipt"></i><span>Transactions</span></a></li>
        </ul>

        <div class="sidebar-bottom">
            <ul class="menu">
                <li class="active">
                    <a href="settings.html">
                        <i class="fa-solid fa-gear"></i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <main class="main-content">

        <div class="header">
            <div>
                <h2>Settings</h2>
                <p>Manage your store settings</p>
            </div>

            <div class="profile">
                <i class="fa-regular fa-bell"></i>
                <div class="avatar">A</div>
                <span>Admin</span>
            </div>
        </div>

        <div class="settings-content">

            <div class="settings-section">
                <h3><i class="fa-solid fa-store"></i> Store Information</h3>

                <div class="settings-form">
                    <div class="form-group">
                        <label>Store Name</label>
                        <input type="text" placeholder="Enter store name">
                    </div>

                    <div class="form-group">
                        <label>Store Address</label>
                        <input type="text" placeholder="Enter store address">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Enter email address">
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3><i class="fa-solid fa-receipt"></i> Receipt Settings</h3>

                <div class="settings-form">
                    <div class="form-group">
                        <label>Receipt Header</label>
                        <input type="text" placeholder="Enter receipt header">
                    </div>

                    <div class="form-group">
                        <label>Receipt Footer</label>
                        <input type="text" placeholder="Thank you for shopping!">
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3><i class="fa-solid fa-sliders"></i> General Settings</h3>

                <div class="settings-form">
                    <div class="form-group">
                        <label>Currency</label>
                        <select>
                            <option>LKR (Rs.)</option>
                            <option>USD ($)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Low Stock Alert Level</label>
                        <input type="number" value="10">
                    </div>
                </div>
            </div>

            <button class="save-settings-btn">
                <i class="fa-solid fa-floppy-disk"></i> Save Settings
            </button>

        </div>

    </main>
</div>

<script src="../js/script.js"></script>
</body>
</html>
